name: Multi-Platform Build

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Android APK
        run: ./gradlew :android:assembleDebug

      - name: Build Desktop JAR
        run: ./gradlew :desktop:dist

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Pixel-Dungeon-Android-APK
          path: android/build/outputs/apk/debug/*.apk

      - name: Upload Desktop JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shattered-Pixel-Dungeon-Desktop-JAR
          path: desktop/build/libs/*.jar
